---
# Ansible connection variables for all hosts
ansible_become_method: sudo
ansible_python_interpreter: /usr/bin/python3

# Roles to be included for all hosts
install_git: true
install_gh: true
install_starship: true
install_claude: true

# Git variables: replace these placeholders with your own identity,
# or override them in inventory/host_vars/<hostname>.yml
git_user_name: 'Your Name'
git_user_email: 'you@example.com'
